
<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин — Продукти</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo">🛍️ MiniShop</a>
    <nav class="nav">
      <a href="index.html" class="nav__link nav__link--active">Продукти</a>
      <a href="cart.html" class="nav__link">
        Кошик <span class="badge" data-cart-count>0</span>
      </a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Продукти</h1>

    <form class="filters" id="filters" autocomplete="off">
      <input type="search" name="search" class="input" placeholder="Пошук за назвою..." />

      <select name="category" class="input">
        <option value="all">Усі категорії</option>
      </select>

      <input type="number" name="minPrice" class="input input--short" placeholder="Ціна від" min="0" />
      <input type="number" name="maxPrice" class="input input--short" placeholder="Ціна до" min="0" />

      <select name="sort" class="input">
        <option value="default">Без сортування</option>
        <option value="price-asc">Ціна: за зростанням</option>
        <option value="price-desc">Ціна: за спаданням</option>
        <option value="title-asc">Назва: А → Я</option>
        <option value="rating-desc">Рейтинг: спочатку кращі</option>
      </select>

      <button type="reset" class="btn btn--ghost">Скинути</button>
    </form>

    <p class="results-info" id="results-info"></p>
    <div class="grid" id="products"></div>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="/src/main.js"></script>

</body>

</html>
